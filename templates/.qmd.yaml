# QMD Configuration — Super-Intelligence Agent Stack
# Generated by installer

index:
  db: ~/.cache/qmd/index.sqlite

collections:
  - name: wiki
    path: "{{VAULT_PATH_FWD}}/wiki"
  - name: conversations
    path: "{{VAULT_PATH_FWD}}/raw/conversations"
  - name: articles
    path: "{{VAULT_PATH_FWD}}/raw/articles"
  - name: skills
    path: "{{VAULT_PATH_FWD}}/.agents/skills"
  - name: obsidian
    path: "{{VAULT_PATH_FWD}}"

search:
  hybrid: true
  rerank: true
  max_results: 20

# Add your own collections here:
